name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # If the project was uploaded as a single .zip at the repo root
      # (handy when you can't drag-and-drop a whole folder from a phone),
      # unpack it here before building.
      - name: Unzip source if present
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Found ${zips[0]}, extracting..."
            unzip -oq "${zips[0]}" -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
